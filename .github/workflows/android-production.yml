# Promotes the latest closed testing release to production
# (fastlane android promote_production). Manual only. Add required reviewers
# to the "production" environment for an approval step.
name: Promote to production

on:
  workflow_dispatch:
    inputs:
      rollout:
        description: "Share of users to roll out to (e.g. 0.2 for 20%, 1 for everyone)"
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ROLLOUT: ${{ inputs.rollout }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Play credentials
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$PLAY_JSON" || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set"; exit 1; }
          printf '%s' "$PLAY_JSON" > fastlane/play-service-account.json
      - name: Promote (fastlane android promote_production)
        run: bundle exec fastlane android promote_production "rollout:${ROLLOUT}"
      - name: Remove secrets from the runner
        if: always()
        run: rm -f fastlane/play-service-account.json
