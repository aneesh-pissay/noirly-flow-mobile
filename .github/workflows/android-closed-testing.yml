# Builds a signed App Bundle and uploads it to Google Play's closed testing
# track (fastlane android closed_testing).
#
# Runs on a version tag (v1.2.3 → versionName 1.2.3) or by hand. The version
# code is always one more than the highest already on Play.
#
# First release only: Play's API cannot upload to an app that has never had a
# build. Run this by hand with "upload" unticked, download the .aab artifact,
# and upload it once in the Play Console (docs/CI_CD.md, step 5).
name: Release to closed testing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Google Play (untick to only build the .aab)"
        type: boolean
        default: true
      release_status:
        description: "Release status on the track"
        type: choice
        options: [completed, draft]
        default: completed
      version_name:
        description: "Version name (default: package.json version)"
        type: string
        required: false

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: closed-testing
    env:
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version_name }}
      RELEASE_STATUS: ${{ inputs.release_status || 'completed' }}
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install JS dependencies
        run: npm ci
        env:
          # A read:packages token, or the built-in token once each private package grants this repo Actions access.
          NODE_AUTH_TOKEN: ${{ secrets.NOIRLY_PACKAGES_TOKEN || github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Signing key and Play credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/noirly-flow-release.keystore
          {
            echo "storeFile=noirly-flow-release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-noirly-flow}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/keystore.properties
          if [ -n "$PLAY_JSON" ]; then printf '%s' "$PLAY_JSON" > fastlane/play-service-account.json; fi
          if [ "$UPLOAD" = "true" ] && [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set"; exit 1
          fi

      - name: Build and upload (fastlane android closed_testing)
        if: env.UPLOAD == 'true'
        run: |
          args=("release_status:${RELEASE_STATUS}")
          if [ -n "$VERSION_NAME" ]; then args+=("version_name:${VERSION_NAME#v}"); fi
          bundle exec fastlane android closed_testing "${args[@]}"

      - name: Build only (fastlane android build)
        if: env.UPLOAD != 'true'
        run: |
          args=("version_code:${GITHUB_RUN_NUMBER}")
          if [ -n "$VERSION_NAME" ]; then args+=("version_name:${VERSION_NAME#v}"); fi
          bundle exec fastlane android build "${args[@]}"

      - name: Keep the .aab
        uses: actions/upload-artifact@v4
        with:
          name: noirly-flow-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove secrets from the runner
        if: always()
        run: rm -f android/app/noirly-flow-release.keystore android/keystore.properties fastlane/play-service-account.json
