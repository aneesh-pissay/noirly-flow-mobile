<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Noirly Flow - Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed-dim": "#c6c6c7",
                      "tertiary-container": "#eae1dd",
                      "on-primary-fixed": "#1a1c1c",
                      "on-error": "#690005",
                      "secondary-fixed": "#e5e2e1",
                      "on-secondary-fixed": "#1c1b1b",
                      "surface-container-highest": "#353535",
                      "secondary-fixed-dim": "#c9c6c5",
                      "surface-container": "#1f1f1f",
                      "background": "#131313",
                      "error": "#ffb4ab",
                      "surface": "#131313",
                      "surface-container-low": "#1b1b1b",
                      "primary-fixed": "#e2e2e2",
                      "surface-variant": "#353535",
                      "on-surface-variant": "#c4c7c8",
                      "error-container": "#93000a",
                      "inverse-primary": "#5d5f5f",
                      "secondary-container": "#4a4949",
                      "on-secondary-container": "#bab8b7",
                      "on-tertiary-fixed-variant": "#4b4643",
                      "on-tertiary-container": "#696360",
                      "primary": "#ffffff",
                      "secondary": "#c9c6c5",
                      "muted-text": "rgba(245, 245, 245, 0.60)",
                      "surface-dim": "#131313",
                      "on-tertiary-fixed": "#1f1b19",
                      "on-primary": "#2f3131",
                      "primary-container": "#e2e2e2",
                      "tertiary-fixed": "#eae1dd",
                      "on-surface": "#e2e2e2",
                      "surface-tint": "#c6c6c7",
                      "outline-variant": "#444748",
                      "border-gray": "#333333",
                      "outline": "#8e9192",
                      "on-error-container": "#ffdad6",
                      "on-secondary-fixed-variant": "#474646",
                      "on-background": "#e2e2e2",
                      "on-tertiary": "#342f2d",
                      "inverse-on-surface": "#303030",
                      "on-primary-container": "#636565",
                      "surface-container-lowest": "#0e0e0e",
                      "tertiary-fixed-dim": "#cec5c1",
                      "tertiary": "#ffffff",
                      "inverse-surface": "#e2e2e2",
                      "surface-container-high": "#2a2a2a",
                      "on-secondary": "#313030",
                      "surface-bright": "#393939",
                      "on-primary-fixed-variant": "#454747"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "touch-target": "44px",
                      "gutter": "16px",
                      "unit": "4px",
                      "margin-mobile": "20px"
              },
              "fontFamily": {
                      "headline-lg": [
                              "Space Grotesk"
                      ],
                      "display-matrix": [
                              "Space Grotesk"
                      ],
                      "label-mono": [
                              "Space Mono"
                      ],
                      "numeral-xl": [
                              "Space Mono"
                      ],
                      "headline-lg-mobile": [
                              "Space Grotesk"
                      ],
                      "body-md": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "36px",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-matrix": [
                              "48px",
                              {
                                      "lineHeight": "48px",
                                      "letterSpacing": "-0.05em",
                                      "fontWeight": "700"
                              }
                      ],
                      "label-mono": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.1em",
                                      "fontWeight": "400"
                              }
                      ],
                      "numeral-xl": [
                              "40px",
                              {
                                      "lineHeight": "40px",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg-mobile": [
                              "28px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
        .dashed-border {
            border: 1px dashed rgba(255, 255, 255, 0.4);
        }
        .dashed-divider {
            border-top: 1px dashed rgba(255, 255, 255, 0.4);
        }
      </style>
</head>
<body class="bg-background text-primary font-body-md text-body-md min-h-screen flex flex-col pb-[72px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center px-margin-mobile bg-background dark:bg-background h-[56px] left-0 border-b border-dashed border-outline-variant/40">
<button class="flex items-center justify-center w-touch-target h-touch-target -ml-2 text-primary dark:text-primary active:invert transition-all duration-75 hover:bg-surface-variant/10">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<h1 class="flex-1 text-center font-headline-lg-mobile text-headline-lg-mobile dark:text-on-surface uppercase tracking-tighter mr-8">SETTINGS</h1>
</header>
<main class="flex-1 pt-[72px] px-margin-mobile flex flex-col gap-8">
<!-- Identity Section -->
<section class="flex flex-col gap-4">
<h2 class="font-display-matrix text-[32px] leading-tight tracking-widest text-primary uppercase border-b border-dashed border-outline-variant/40 pb-2 mb-2">IDENTITY</h2>
<div class="flex flex-col gap-2">
<span class="font-label-mono text-label-mono text-muted-text">NAME</span>
<span class="font-body-md text-body-md text-primary">System Administrator</span>
</div>
<div class="flex flex-col gap-2">
<span class="font-label-mono text-label-mono text-muted-text">EMAIL</span>
<span class="font-body-md text-body-md text-primary">admin@noirlyflow.net</span>
</div>
<a class="inline-flex items-center gap-1 font-label-mono text-label-mono text-primary underline mt-2 w-max active:invert transition-all" href="#">
                Manage account <span class="material-symbols-outlined text-[16px]" data-icon="arrow_outward">arrow_outward</span>
</a>
</section>
<div class="dashed-divider w-full"></div>
<!-- Flow Profile Section -->
<section class="flex flex-col gap-6 pb-24">
<h2 class="font-display-matrix text-[32px] leading-tight tracking-widest text-primary uppercase border-b border-dashed border-outline-variant/40 pb-2">FLOW_PROFILE</h2>
<!-- Display Name Input -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-primary uppercase" for="display-name">DISPLAY NAME</label>
<div class="relative w-full h-[48px] bg-surface-container-lowest dashed-border flex items-center focus-within:border-solid focus-within:border-primary transition-all">
<input class="w-full h-full bg-transparent border-none text-primary font-body-md text-body-md px-4 focus:ring-0 placeholder:text-muted-text" id="display-name" type="text" value="SysAdmin_01"/>
</div>
<p class="font-label-mono text-label-mono text-muted-text lowercase mt-1">This name is visible across Members, comments, and boards.</p>
</div>
<!-- Title Input -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-primary uppercase" for="title">TITLE</label>
<div class="relative w-full h-[48px] bg-surface-container-lowest dashed-border flex items-center focus-within:border-solid focus-within:border-primary transition-all">
<input class="w-full h-full bg-transparent border-none text-primary font-body-md text-body-md px-4 focus:ring-0 placeholder:text-muted-text" id="title" type="text" value="Lead Architect"/>
</div>
</div>
<!-- Timezone Select -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-primary uppercase" for="timezone">TIMEZONE</label>
<div class="relative w-full h-[48px] bg-surface-container-lowest dashed-border flex items-center focus-within:border-solid focus-within:border-primary transition-all">
<select class="w-full h-full bg-transparent border-none text-primary font-body-md text-body-md px-4 appearance-none focus:ring-0 z-10 cursor-pointer" id="timezone">
<option value="utc">UTC+00:00</option>
<option value="est">UTC-05:00</option>
<option value="pst">UTC-08:00</option>
</select>
<span class="material-symbols-outlined absolute right-4 text-primary pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Bio Textarea -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-primary uppercase" for="bio">BIO</label>
<div class="relative w-full bg-surface-container-lowest dashed-border flex focus-within:border-solid focus-within:border-primary transition-all">
<textarea class="w-full bg-transparent border-none text-primary font-body-md text-body-md p-4 focus:ring-0 resize-none placeholder:text-muted-text" id="bio" placeholder="Enter system diagnostic notes here..." rows="4"></textarea>
</div>
</div>
<!-- Save Button -->
<button class="w-full h-[56px] bg-primary text-background font-label-mono text-label-mono uppercase tracking-widest mt-4 active:scale-[0.98] transition-transform flex items-center justify-center">
                SAVE CHANGES
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-stretch bg-background dark:bg-background h-[72px] border-t border-dashed border-outline-variant/40 md:hidden">
<button class="flex flex-col items-center justify-center text-primary p-2 h-full w-full hover:bg-surface-container-high active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined mb-1" data-icon="inbox">inbox</span>
<span class="font-label-mono text-label-mono uppercase tracking-widest">Inbox</span>
</button>
<button class="flex flex-col items-center justify-center text-primary p-2 h-full w-full hover:bg-surface-container-high active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined mb-1" data-icon="grid_view">grid_view</span>
<span class="font-label-mono text-label-mono uppercase tracking-widest">Board</span>
</button>
<button class="flex flex-col items-center justify-center text-primary p-2 h-full w-full hover:bg-surface-container-high active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined mb-1" data-icon="search">search</span>
<span class="font-label-mono text-label-mono uppercase tracking-widest">Search</span>
</button>
<!-- Active Tab (Menu / Settings maps here logically) -->
<button class="flex flex-col items-center justify-center bg-primary text-background p-2 h-full w-full hover:bg-surface-container-high active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined mb-1" data-icon="menu">menu</span>
<span class="font-label-mono text-label-mono uppercase tracking-widest">Menu</span>
</button>
</nav>
</body></html>
