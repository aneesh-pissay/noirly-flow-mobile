<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Noirly Flow - Invite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#353535",
                        "inverse-surface": "#e2e2e2",
                        "on-tertiary-fixed-variant": "#4b4643",
                        "surface": "#131313",
                        "tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#474646",
                        "secondary-fixed": "#e5e2e1",
                        "on-primary-container": "#636565",
                        "outline": "#8e9192",
                        "surface-tint": "#c6c6c7",
                        "border-gray": "#333333",
                        "background": "#131313",
                        "tertiary-fixed-dim": "#cec5c1",
                        "surface-bright": "#393939",
                        "on-primary-fixed-variant": "#454747",
                        "on-secondary": "#313030",
                        "surface-container-high": "#2a2a2a",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-variant": "#353535",
                        "secondary": "#c9c6c5",
                        "on-primary": "#2f3131",
                        "on-surface": "#e2e2e2",
                        "on-secondary-fixed": "#1c1b1b",
                        "muted-text": "rgba(245, 245, 245, 0.60)",
                        "tertiary-container": "#eae1dd",
                        "on-surface-variant": "#c4c7c8",
                        "on-background": "#e2e2e2",
                        "surface-container-low": "#1b1b1b",
                        "primary-container": "#e2e2e2",
                        "outline-variant": "#444748",
                        "primary": "#ffffff",
                        "error-container": "#93000a",
                        "surface-dim": "#131313",
                        "on-tertiary": "#342f2d",
                        "primary-fixed": "#e2e2e2",
                        "surface-container": "#1f1f1f",
                        "on-tertiary-container": "#696360",
                        "on-primary-fixed": "#1a1c1c",
                        "inverse-on-surface": "#303030",
                        "tertiary-fixed": "#eae1dd",
                        "secondary-container": "#4a4949",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "primary-fixed-dim": "#c6c6c7",
                        "inverse-primary": "#5d5f5f",
                        "on-tertiary-fixed": "#1f1b19",
                        "secondary-fixed-dim": "#c9c6c5",
                        "on-secondary-container": "#bab8b7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0rem",
                        "lg": "0rem",
                        "xl": "0rem",
                        "full": "0rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "touch-target": "44px",
                        "unit": "4px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "display-matrix": ["Space Grotesk"],
                        "label-mono": ["Space Mono"],
                        "numeral-xl": ["Space Mono"],
                        "headline-lg-mobile": ["Space Grotesk"],
                        "headline-lg": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-matrix": ["48px", { "lineHeight": "48px", "letterSpacing": "-0.05em", "fontWeight": "700" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "400" }],
                        "numeral-xl": ["40px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "36px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #000000; /* True Black */
            color: #ffffff;
        }
        .dashed-border {
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }
        .dashed-border-thick {
            border: 1px dashed rgba(255, 255, 255, 0.4);
        }
        .surface-card {
            background-color: #0D0D0D;
        }
        /* Custom scrollbar for mobile lists */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
        }
        
        .dot-matrix-text {
            /* Simulated dot matrix effect using background clipping if desired, but relying on Space Grotesk/Mono mostly */
            background-image: radial-gradient(circle, #fff 1px, transparent 1px);
            background-size: 3px 3px;
            -webkit-background-clip: text;
            background-clip: text;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile relative">
<!-- Active Invite State -->
<div class="w-full max-w-sm flex flex-col gap-8 transition-opacity duration-300" id="invite-active">
<header class="text-center w-full">
<h1 class="font-display-matrix text-display-matrix text-primary mb-2">NOIRLY</h1>
<p class="font-label-mono text-label-mono text-muted-text">[SYS.INVITE_PROC]</p>
</header>
<main class="surface-card dashed-border p-6 flex flex-col gap-6 w-full">
<div class="flex items-center justify-between border-b border-dashed border-white/20 pb-4">
<span class="font-label-mono text-label-mono text-muted-text">REQ_ID: 9X82-K</span>
<span class="font-label-mono text-label-mono text-primary">[MEMBER]</span>
</div>
<div class="text-center py-4">
<span class="material-symbols-outlined text-4xl mb-4 text-primary" data-icon="add_circle" style="font-variation-settings: 'FILL' 0;">add_circle</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">
                    You've been invited to join Q1 Marketing Campaign
                </h2>
</div>
<div class="flex flex-col gap-3 pt-4 border-t border-dashed border-white/20">
<button class="w-full h-touch-target bg-primary text-on-primary flex items-center justify-center font-label-mono text-label-mono uppercase tracking-widest active:bg-surface-variant active:text-primary transition-colors" onclick="toggleState()">
                    Accept invite
                </button>
<p class="text-center text-muted-text font-label-mono text-[10px] uppercase">
                    Signed in as admin@noirly.flow
                </p>
</div>
</main>
<div class="text-center">
<button class="font-label-mono text-label-mono text-muted-text hover:text-primary transition-colors underline decoration-dashed underline-offset-4" onclick="toggleState()">
                Switch Account
            </button>
</div>
</div>
<!-- Expired Invite State (Hidden by default) -->
<div class="w-full max-w-sm flex flex-col gap-8 hidden opacity-0 transition-opacity duration-300 absolute" id="invite-expired">
<header class="text-center w-full">
<h1 class="font-display-matrix text-display-matrix text-muted-text opacity-50">NOIRLY</h1>
<p class="font-label-mono text-label-mono text-error">[SYS.ERR_410]</p>
</header>
<main class="surface-card border border-dashed border-error/40 p-6 flex flex-col gap-6 w-full text-center">
<div class="py-6">
<span class="material-symbols-outlined text-4xl mb-4 text-error" data-icon="block" style="font-variation-settings: 'FILL' 0;">block</span>
<h2 class="font-body-md text-body-md text-muted-text">
                    This invite link has expired or is invalid.
                </h2>
</div>
<div class="pt-4 border-t border-dashed border-white/20">
<button class="w-full h-touch-target bg-transparent text-primary dashed-border flex items-center justify-center font-label-mono text-label-mono uppercase tracking-widest hover:bg-surface-container-highest active:invert transition-colors" onclick="toggleState()">
                    Return to Home
                </button>
</div>
</main>
</div>
<!-- Suppressed Nav Shell for this transactional/modal page -->
<!-- Nav is deliberately omitted as per instructions for deep-link/modal entry point -->
<script>
        function toggleState() {
            const active = document.getElementById('invite-active');
            const expired = document.getElementById('invite-expired');
            
            if (active.classList.contains('hidden')) {
                // Show active
                expired.classList.remove('opacity-100');
                expired.classList.add('opacity-0');
                setTimeout(() => {
                    expired.classList.add('hidden');
                    expired.classList.add('absolute');
                    
                    active.classList.remove('hidden');
                    active.classList.remove('absolute');
                    // trigger reflow
                    void active.offsetWidth;
                    active.classList.remove('opacity-0');
                    active.classList.add('opacity-100');
                }, 300);
            } else {
                // Show expired
                active.classList.remove('opacity-100');
                active.classList.add('opacity-0');
                setTimeout(() => {
                    active.classList.add('hidden');
                    active.classList.add('absolute');
                    
                    expired.classList.remove('hidden');
                    expired.classList.remove('absolute');
                    // trigger reflow
                    void expired.offsetWidth;
                    expired.classList.remove('opacity-0');
                    expired.classList.add('opacity-100');
                }, 300);
            }
        }
    </script>
</body></html>
